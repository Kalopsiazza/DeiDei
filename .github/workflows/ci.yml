name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: core-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Check syntax and run core tests
        run: python scripts/check.py
      - name: Install locked telemetry dependencies
        run: |
          python -m venv game/telemetry/.venv
          game/telemetry/.venv/bin/python -m pip install --require-hashes --only-binary=:all: -r game/telemetry/requirements.lock
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
      - name: Install locked desktop dependencies
        run: npm --prefix game/desktop ci
      - name: Check desktop types, build and tests
        run: npm --prefix game/desktop test
