name: R01-T02-b packages
on:
  pull_request:
    branches: [docs/design-discussion-20260911]
    paths:
      - experiments/r01-t02-b/**
      - .github/workflows/r01-t02-b.yml
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macOS-arm64
            architecture: arm64
            lock: requirements-build-macos-arm64.txt
          - os: windows-2022
            platform: Windows-x64
            architecture: x64
            lock: requirements-build-windows.txt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: experiments/r01-t02-b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.12.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.15'
          architecture: ${{ matrix.architecture }}
      - name: Locked build dependencies
        env:
          LOCK: ${{ matrix.lock }}
        run: |
          python -m pip install -r "$LOCK"
          npm ci
      - name: Build worker and test
        run: |
          python build-worker.py
          python test-worker.py
          if [ "$RUNNER_OS" = "Windows" ]; then
            python test-worker.py dist/worker/worker.exe
          else
            python test-worker.py dist/worker/worker
          fi
          npm test
          python ../../scripts/check.py
      - name: Package without desktop acceptance claim
        run: |
          npm run package
          python collect-package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r01-t02-b-${{ matrix.platform }}-${{ github.event.pull_request.head.sha }}
          path: experiments/r01-t02-b/build/delivery/*
          if-no-files-found: error
          retention-days: 14
