name: R02 T04 source review
on:
  pull_request:
    branches: [integration/r02]
    paths: [.github/workflows/r02-t04-review.yml]
permissions:
  contents: read
jobs:
  source-check:
    if: github.head_ref == 'review/r02-t04-20260913'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Kalopsiazza/DeiDei
          ref: 980a019d9a1410bf3ee72263d90397023696f32b
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Source identity
        run: |
          mkdir review-evidence
          git rev-parse HEAD > review-evidence/candidate-sha.txt
          python --version > review-evidence/python-version.txt
      - name: Runtime tests
        env:
          PYTHONPATH: game/core:game/runtime
        run: python -m unittest discover -s game/runtime/tests -v 2>&1 | tee review-evidence/runtime.txt
      - name: Core tests
        if: always()
        env:
          PYTHONPATH: game/core
        run: python -m unittest discover -s game/core/tests -v 2>&1 | tee review-evidence/core.txt
      - name: Independent cases
        if: always()
        run: python tests/rules_v1_001/run_acceptance.py --core game/core 2>&1 | tee review-evidence/independent.txt
      - name: Preserve inspected source and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r02-t04-review-980a019
          retention-days: 7
          path: |
            review-evidence/
            game/
            tests/
            docs/results/R02-T04-a/
            docs/architecture/
            docs/prd/
            docs/tasks/R02/
            docs/production/
